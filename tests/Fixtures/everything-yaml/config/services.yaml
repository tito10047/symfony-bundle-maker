# Services are defined explicitly: no autowiring, no autoconfiguration, private by default,
# with ids prefixed by "tito10047_everything_yaml." and aliases for autowiring.
#
# See https://symfony.com/doc/current/bundles/best_practices.html#services

services:
    tito10047_everything_yaml.greeter:
        class: Tito10047\EverythingYamlBundle\Greeter

    tito10047_everything_yaml.controller.hello:
        class: Tito10047\EverythingYamlBundle\Controller\HelloController
        arguments:
            - '@tito10047_everything_yaml.greeter'
            - '@twig'
        tags:
            - { name: 'controller.service_arguments' }

    tito10047_everything_yaml.command.hello:
        class: Tito10047\EverythingYamlBundle\Command\HelloCommand
        arguments:
            - '@tito10047_everything_yaml.greeter'
        tags:
            - { name: 'console.command' }

    tito10047_everything_yaml.event_listener.greeting_header:
        class: Tito10047\EverythingYamlBundle\EventListener\GreetingHeaderListener
        arguments:
            - '@tito10047_everything_yaml.greeter'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.response' }

    Tito10047\EverythingYamlBundle\GreeterInterface:
        alias: tito10047_everything_yaml.greeter
